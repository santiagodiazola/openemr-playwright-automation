name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers & OS Dependencies
        run: npx playwright install --with-deps chromium

      # 1. Spin up OpenEMR & MariaDB in CI
      - name: Start Docker Containers
        run: docker compose up -d

      # 2. Wait for OpenEMR to respond
      - name: Wait for OpenEMR
        run: npx wait-on http://localhost:8300/ --timeout 60000

      # 3. Run Playwright against local Docker instance
      - name: Run Playwright tests
        run: npx playwright test
        env:
          BASE_URL: "http://localhost:8300/"

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
