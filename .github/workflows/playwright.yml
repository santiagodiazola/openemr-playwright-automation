name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Start Docker Containers
        run: docker compose up -d

      - name: Wait for OpenEMR Initialization
        run: |
          echo "Waiting for MariaDB and OpenEMR containers to initialize..."
          sleep 60
          for i in {1..20}; do
            if curl -s -L http://localhost:8300/ | grep -q "OpenEMR"; then
              echo "OpenEMR is fully initialized and responding!"
              exit 0
            fi
            echo "Waiting for OpenEMR web service... ($i/20)"
            sleep 10
          done
          echo "OpenEMR failed to initialize within time limit."
          exit 1

      - name: Run Playwright Tests
        run: npx playwright test
        env:
          BASE_URL: "http://localhost:8300/"

      - name: Stop Docker Containers
        if: ${{ always() }}
        run: docker compose down -v

      - name: Upload Test Report Artifact
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
