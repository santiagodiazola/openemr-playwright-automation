services:
  mysql:
    image: mariadb:10.11
    container_name: openemr_db
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test:
        ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  openemr:
    image: openemr/openemr:7.0.2
    container_name: openemr_app
    ports:
      - "8300:80"
    environment:
      MYSQL_HOST: mysql
      MYSQL_ROOT_PASS: root
      OE_USER: admin
      OE_PASS: pass
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  db_data:
